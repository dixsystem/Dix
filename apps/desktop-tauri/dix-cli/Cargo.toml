[package]
name    = "dix-cli"
version = "1.0.5"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "dix-cli"
path = "src/main.rs"

[dependencies]
dix        = { path = "../src-tauri" }
tokio      = { version = "1", features = ["full"] }
serde_json = "1"

# [profile.release] vive en el Cargo.toml raíz del workspace.
