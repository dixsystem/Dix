[package]
name        = "dix"
version     = "1.0.8"
edition     = "2021"
description = "La primera AppIA del Mundo — optimiza tu PC con IA real en segundos"
authors     = ["DixSystem <hello@dixsystem.com>"]
license     = "LicenseRef-Proprietary"
homepage    = "https://dixsystem.com"

[[bin]]
name = "dix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                 = { version = "2", features = ["image-png"] }
tauri-plugin-updater  = "2"
tauri-plugin-process  = "2"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
reqwest               = { version = "0.12", features = ["json", "rustls-tls", "charset"], default-features = false }
tokio                 = { version = "1", features = ["full"] }
obfstr                = "0.4"
dirs                  = "5"
keyring               = "4"

[target.'cfg(windows)'.dependencies]
winreg   = "0.52"
windows  = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }


[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
