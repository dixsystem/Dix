[package]
name        = "dix"
version = "1.0.12"
edition     = "2021"
description = "DIX is an open-source desktop client for system optimization workflows with optional user-controlled AI assistance."
authors     = ["DixSystem <hello@dixsystem.com>"]
license     = "AGPL-3.0-only"
homepage    = "https://dixsystem.com"

[[bin]]
name = "dix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                 = { version = "2", features = ["image-png"] }
tauri-plugin-updater  = "2"
tauri-plugin-process  = "2"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
reqwest               = { version = "0.12", features = ["json", "rustls-tls", "charset"], default-features = false }
tokio                 = { version = "1", features = ["full"] }
obfstr                = "0.4"
dirs                  = "5"
keyring               = "4"
chrono                = { version = "0.4", features = ["serde"] }
thiserror             = "1.0"
uuid                  = { version = "1", features = ["v4", "serde"] }
sha2                  = "0.10"

[target.'cfg(windows)'.dependencies]
winreg   = "0.52"
windows  = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

# [profile.release] vive en el Cargo.toml raíz del workspace — un perfil de
# miembro no root se ignora (advertencia de Cargo).
