name: Deploy Landing a Netlify

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'netlify.toml'

jobs:
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing
        run: npx netlify deploy --prod --dir=landing --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}
