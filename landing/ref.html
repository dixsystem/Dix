<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIX — Descargando...</title>
  <style>
    body { margin: 0; background: #0d1117; color: #fff; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .logo { font-size: 2.5rem; font-weight: 900; color: #FF6B00; margin-bottom: 16px; }
    p { color: #8b949e; font-size: 1rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #30363d; border-top-color: #FF6B00;
               border-radius: 50%; animation: spin 0.8s linear infinite; margin: 24px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="logo">DIX</div>
    <div class="spinner"></div>
    <p>Preparando tu descarga...</p>
  </div>
  <script>
    (function () {
      var code = location.pathname.replace(/^\/ref\/?/, '').replace(/\/$/, '');

      function redirect() {
        var ua = navigator.userAgent;
        if (/Windows/i.test(ua)) {
          location.href = 'https://github.com/dixsystem/Dix/releases/download/v1.0.12/Dix_1.0.12_x64-setup.exe';
        } else {
          location.href = 'https://github.com/dixsystem/Dix/releases/latest';
        }
      }

      if (code && /^DIX-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) {
        fetch('https://dix-proxy.dixsystem.workers.dev/referral/' + code + '/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ via: 'web' })
        }).finally(function () {
          setTimeout(redirect, 200);
        });
      } else {
        redirect();
      }
    })();
  </script>
</body>
</html>
